# ==============================================================================
# Zisha OS 1.0 — Automated Debian 12 Preseed Configuration
# Optimized for: 13th Gen Intel Core i3-1315U (6 Cores, 8 Threads, 8GB RAM)
# ==============================================================================

# 1. Localization (English + Bengali UTF-8)
d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8, bn_BD.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# 2. Network & Hostname
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string zisha-os
d-i netcfg/get_domain string local

# 3. Mirror & Package Archive (with contrib & non-free-firmware for Intel Wi-Fi/Graphics)
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true

# 4. Clock & Timezone (Bangladesh Standard Time)
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Dhaka
d-i clock-setup/ntp boolean true

# 5. Base Tasks
tasksel tasksel/first multiselect standard, xfce-desktop
d-i pkgsel/include string sudo curl git ufw zram-tools earlyoom ibus ibus-avro ibus-m17n libreoffice-writer libreoffice-calc libreoffice-l10n-bn fonts-beng fonts-noto-core tesseract-ocr-ben gimagereader docker.io python3-venv python3-pip nodejs npm
d-i popularity-contest/participate boolean false

# 6. Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i finish-install/reboot_in_progress note
