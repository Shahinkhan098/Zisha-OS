# ==============================================================================
# Zisha OS 1.0 — Realtek RTL8852BE / RTL8852CE Wi-Fi 6 Power & Stability Fix
# Disables aggressive PCIe ASPM power-collapse on modern Intel laptops
# ==============================================================================
options rtw89_pci disable_aspm_l1=y disable_aspm_l1ss=y
options rtw89_core disable_lps_deep=y
