# ==============================================================================
# Zisha OS 1.0 — Kernel Security Hardening & Developer/AI Performance Tuning
# Location: /etc/sysctl.d/99-zisha-os-hardening.conf
# ==============================================================================

# --- 1. Kernel & Memory Security Protection ---
# Hide kernel pointers from unprivileged processes
kernel.kptr_restrict = 2
# Restrict dmesg access to root/privileged users only
kernel.dmesg_restrict = 1
# Restrict ptrace to direct parent processes (prevents credential theft from memory)
kernel.yama.ptrace_scope = 1
# Disable unprivileged BPF to prevent speculative execution attacks
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# Restrict loading TTY line disciplines
dev.tty.ldisc_autoload = 0
# Protect hardlinks and symlinks in world-writable directories (/tmp)
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# Disable core dumps for setuid programs
fs.suid_dumpable = 0
# Full ASLR (Address Space Layout Randomization)
kernel.randomize_va_space = 2

# --- 2. Network Stack Hardening ---
# Enable TCP SYN Cookie Protection against SYN flood attacks
net.ipv4.tcp_syncookies = 1
# Protect against time-wait assassination hazards
net.ipv4.tcp_rfc1337 = 1
# Enable Reverse Path Filtering (anti-IP spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# Disable ICMP Redirect Acceptance & Sending (prevents MITM routing attacks)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# Ignore broadcast ICMP echo requests (Smurf attack protection)
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# Disable IP source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# --- 3. CPU AI & Web/Software Development Performance Tuning ---
# Keep data in RAM/zram as much as possible before touching disk swap
vm.swappiness = 10
vm.vfs_cache_pressure = 50
# Increase file watchers for large VS Code, Node.js, Next.js & Python AI projects
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
# Increase max memory map areas (essential for Docker, Elasticsearch, and local LLMs)
vm.max_map_count = 262144
# Fast TCP BBR congestion control for faster API calls and package downloads
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
